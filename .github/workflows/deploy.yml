name: Deploy blog-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-frontend-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: npm

      - name: Install and verify
        run: |
          npm ci
          npm run check
          npm audit --audit-level=high

      - name: Resolve immutable image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          echo "name=ghcr.io/${repository}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker build \
            -f DockerFile \
            --build-arg NEXT_PUBLIC_API_URL=https://blogserver.wypark.me \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    runs-on: self-hosted
    needs: build
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull verified image
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker pull "$IMAGE"

      - name: Deploy hardened container
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail

          if [ -n "${FRONTEND_BIND_ADDRESS:-}" ]; then
            bind_address="$FRONTEND_BIND_ADDRESS"
          else
            default_interface="$(ip -4 route show default | awk 'NR == 1 { print $5 }' || true)"
            if [ -z "$default_interface" ]; then
              echo "Failed to resolve the frontend host's default network interface"
              exit 1
            fi
            bind_address="$(ip -o -4 addr show dev "$default_interface" scope global | awk 'NR == 1 { split($4, address, "/"); print address[1] }' || true)"
          fi

          if [[ ! "$bind_address" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Failed to resolve the frontend host's private IPv4 address"
            exit 1
          fi

          IFS=. read -r bind_octet_1 bind_octet_2 _ _ <<< "$bind_address"
          if ! { [ "$bind_octet_1" -eq 10 ] \
            || { [ "$bind_octet_1" -eq 192 ] && [ "$bind_octet_2" -eq 168 ]; } \
            || { [ "$bind_octet_1" -eq 172 ] && [ "$bind_octet_2" -ge 16 ] && [ "$bind_octet_2" -le 31 ]; }; }; then
            echo "Refusing to publish the frontend on non-private address: $bind_address"
            exit 1
          fi

          docker stop blog-frontend || true
          docker rm blog-frontend || true

          docker run -d \
            --name blog-frontend \
            --restart unless-stopped \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 256 \
            --memory 1g \
            --cpus 2 \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,size=128m \
            --health-cmd='wget -q --spider http://127.0.0.1:3000/ || exit 1' \
            --health-interval=10s \
            --health-timeout=5s \
            --health-retries=6 \
            --health-start-period=20s \
            -p "${bind_address}:3005:3000" \
            -e NEXT_PUBLIC_API_URL=https://blogserver.wypark.me \
            "$IMAGE"

          for _ in $(seq 1 12); do
            status="$(docker inspect --format='{{.State.Health.Status}}' blog-frontend)"
            if [ "$status" = healthy ]; then
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 5
          done

          docker logs --tail 100 blog-frontend
          exit 1

      - name: Cleanup old dangling images
        run: docker image prune -f --filter until=168h
