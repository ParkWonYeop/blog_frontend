        <div style="padding: 13px 0;">
          <div style="font-size: 14px; font-weight: 600; line-height: 1.4;">Conventional Commits</div>
          <div style="display: flex; gap: 8px; margin-top: 4px; font-size: 11.5px; color: #858892;"><span style="color: #62646d; font-weight: 500;">DevOps</span><span>7월 30일</span></div>
        </div>
